name: Verify ADC ASCENT
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check app.js && node --check capture-ui.js && node --check desktop/main.js
