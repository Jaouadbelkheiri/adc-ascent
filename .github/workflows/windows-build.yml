name: Package Windows Recorder
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: adc-ascent-windows
          path: |
            dist/*.exe
          retention-days: 30
